[project]
name = "evorag-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14,<4",
    "alembic>=1.16,<2",
    "asyncpg>=0.32,<1",
    "defusedxml>=0.7,<1",
    "fastapi>=0.121,<1",
    "langgraph>=1,<2",
    "openpyxl>=3.1,<4",
    "pgvector>=0.4,<1",
    "pydantic-settings>=2.11,<3",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "redis>=6.4,<8",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
local-models = ["sentence-transformers>=5,<6"]
tracking = ["mlflow-skinny>=3,<4"]
ragas = ["ragas>=0.4,<1"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2,<3",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
