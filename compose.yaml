name: evorag
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-backend: &backend
  image: evorag-backend:local
  build:
    context: ./backend
    args:
      EVORAG_ENABLE_RAGAS: ${EVORAG_ENABLE_RAGAS:-false}
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    OLLAMA_URL: ${OLLAMA_CONTAINER_URL:-http://host.docker.internal:11434}
    WORKFLOW_CHECKPOINT_DB: /data/workflows.sqlite
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - app-data:/data
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql -X -h 127.0.0.1 -U "$$POSTGRES_USER"
          -d "$$POSTGRES_DB" -Atqc "SELECT '[1]'::vector" | grep -Fxq '[1]'
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:?Set REDIS_PORT in .env}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -Fxq PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-ec", "alembic upgrade head && python -m app.db.seed && python -m app.rag.seed_strategies"]

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-u", "-m", "app.ingestion.worker"]
    restart: unless-stopped

  frontend:
    image: evorag-frontend:local
    build: ./frontend
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  app-data:
